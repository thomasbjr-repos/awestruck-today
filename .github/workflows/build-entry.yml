name: Fetch entry media

# Downloads each entry's cleared images (license-checked) into assets/<ID>/ for the website.
# Social assets (reel, carousel, cards) are rendered in the private awestruck-studio repo, not here.
# Runs when an entry file is added or changed, or by hand from the Actions tab.
on:
  push:
    paths: ["content/entries/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (resizes website lead images)
        run: pip install --quiet pillow

      - name: Fetch cleared media (license-checked)
        run: |
          shopt -s nullglob   # no entries yet: do nothing instead of passing the glob through
          for f in content/entries/*.json; do python scripts/fetch_media.py "$f"; done

      - name: Save cleared media to the repo
        run: |
          git config user.name "awestruck-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p assets public/assets
          git add assets public/assets
          git diff --cached --quiet || (git commit -m "Add cleared media [skip ci]" && git push)
