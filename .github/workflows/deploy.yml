name: Build and deploy site

# Rebuilds the site so each entry goes public at midnight Eastern on its date.
# Two daily runs cover both standard time (05:00 UTC) and daylight time (04:00 UTC);
# the build works out the Eastern date itself, so the extra run is harmless.
on:
  push:
    branches: [main]
  schedule:
    - cron: '2 4 * * *'
    - cron: '2 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Check release rules
        run: node scripts/test-build.mjs
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
