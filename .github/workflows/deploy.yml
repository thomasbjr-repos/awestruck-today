name: Build and deploy site

# Rebuilds the site with Astro so each entry goes public at midnight Eastern on its date.
# Two daily runs cover both standard time (05:00 UTC) and daylight time (04:00 UTC);
# the build works out the Eastern date itself, so the extra run is harmless.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '2 4 * * *'
    - cron: '2 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Astro
        run: npm install --no-audit --no-fund
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Check release rules (builds a test copy of the site)
        run: npm test
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npx astro build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site
      # Pull requests: upload the built site so it can be downloaded and checked before merging.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: site-preview
          path: site
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
